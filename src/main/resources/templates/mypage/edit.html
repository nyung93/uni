<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">

  <div class="crumb">학생서비스 <b>›</b> 마이페이지 <b>›</b> 내정보 수정</div>
  <div class="page-title-row"><span class="page-title">내정보 수정<span class="pid">학생</span></span></div>

  <form class="edit-wrap" th:action="@{/mypage/edit}" method="post" onsubmit="alert('저장되었습니다.');">
    <!-- 기본정보 -->
    <div class="edit-sec">
      <div class="edit-sec-h">기본정보</div>
      <div class="edit-row"><div class="edit-label">이름</div><div class="edit-ctrl"><input type="text" value="이하은" readonly></div></div>
      <div class="edit-row"><div class="edit-label">아이디</div><div class="edit-ctrl"><input type="text" value="haeun.lee02@sch.ac.kr" readonly style="width:220px;"><span class="edit-help">* 아이디(이메일)는 수정할 수 없습니다.</span></div></div>
    </div>

    <!-- 학적정보 수정 -->
    <div class="edit-sec">
      <div class="edit-sec-h">학적정보 수정</div>
      <div class="edit-row"><div class="edit-label">학교</div><div class="edit-ctrl"><input type="text" value="순천향중학교" style="width:180px;"><button type="button" class="btn btn-grey btn-mini" onclick="comingSoonAlert()">학교 검색</button></div></div>
      <div class="edit-row"><div class="edit-label">학년 / 반</div><div class="edit-ctrl">
        <select style="width:100px;"><option>2학년</option></select>
        <select style="width:100px;"><option>3반</option></select>
        <span class="edit-help">* 매년 3/1 이후 최초 로그인 시 직접 수정</span>
      </div></div>
    </div>

    <!-- 비밀번호 설정 -->
    <div class="edit-sec">
      <div class="edit-sec-h">비밀번호 설정</div>
      <div class="edit-row"><div class="edit-label">새 비밀번호</div><div class="edit-ctrl"><input type="password" style="width:220px;"><span class="edit-help">* 영대문자·소문자·숫자·특수문자 중 2종 이상 조합, 10자 이상</span></div></div>
      <div class="edit-row"><div class="edit-label">비밀번호 확인</div><div class="edit-ctrl"><input type="password" style="width:220px;"></div></div>
    </div>

    <!-- 저장/취소 -->
    <div class="edit-actions">
      <a class="btn btn-grey" th:href="@{/mypage}">취소</a>
      <button type="submit" class="btn btn-navy">저장</button>
      <span class="edit-help" style="margin-left:6px;">* 비밀번호 설정 완료 시 마이페이지 얼럿이 사라지고 전체 기능 이용 가능</span>
    </div>
  </form>

</div>
</body>
</html>
