<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">

  <div class="crumb">역량개발 <b>›</b> 프로그램 신청내역</div>
  <div class="page-title-row"><span class="page-title">프로그램 신청내역</span></div>

  <div class="app-shell">
    <div th:replace="~{competency/_sidebar :: sidebar}"></div>

    <div class="app-content">
      <div class="hist-head">
        <div class="cnt"><span class="ic">▦</span>내 신청내역 <span th:text="${#lists.size(historyItems)}">6</span>건</div>
        <select onchange="var v=this.value; document.querySelectorAll('.hist-row').forEach(function(r){ r.style.display = (v==='전체' || r.dataset.status===v) ? '' : 'none'; });">
          <option>전체</option><option>신청</option><option>수료</option><option>취소</option>
        </select>
      </div>

      <div class="hist-list">
        <div class="hist-row" th:each="h : ${historyItems}"
             th:classappend="${h.status.name() == 'CANCELED'} ? 'off'"
             th:attr="data-status=${h.status.name() == 'DONE' ? '수료' : (h.status.name() == 'WAIT' ? '신청' : '취소')}">
          <div class="hist-thumb" th:style="'background:' + ${h.gradientCss} + ';'" th:text="${h.icon}">🎯</div>
          <div class="hist-info">
            <div class="hist-title" th:text="${h.title}">프로그램명</div>
            <div class="hist-meta" th:text="${h.roundLabel} + ' | 교육기간 ' + ${h.eduPeriod}">차수 | 교육기간</div>
            <div class="hist-area"><span class="area-dot" th:classappend="${h.area == '창의'} ? 'dot-cr' : (${h.area == '공감'} ? 'dot-em' : 'dot-gl')"></span><span th:text="${h.area}">영역</span></div>
          </div>
          <div class="hist-col">
            <div class="lb">상태</div>
            <div class="vv" th:classappend="${h.status.name() == 'DONE'} ? 'st-done' : (${h.status.name() == 'WAIT'} ? 'st-wait' : 'st-canc')"
                 th:text="${h.status.name() == 'DONE'} ? '수료' : (${h.status.name() == 'WAIT'} ? '신청' : '취소')">상태</div>
          </div>
          <div class="hist-col">
            <div class="lb">역량점수</div>
            <div class="vv" th:classappend="${h.area == '창의'} ? 'pt-cr' : (${h.area == '공감'} ? 'pt-em' : 'pt-gl')">
              <span th:if="${h.points != null}" th:text="${h.points} + '점'">4점</span>
              <span th:unless="${h.points != null}" class="dl">－</span>
            </div>
          </div>
          <div class="hist-mng">
            <th:block th:if="${h.status.name() == 'DONE'}">
              <button type="button" class="btn btn-navy btn-mini" onclick="comingSoonAlert()">수료증</button>
              <button type="button" class="btn btn-grey btn-mini" onclick="comingSoonAlert()">만족도</button>
            </th:block>
            <th:block th:if="${h.status.name() == 'WAIT'}">
              <button type="button" class="btn btn-grey btn-mini" onclick="comingSoonAlert()">수정</button>
              <button type="button" class="btn btn-grey btn-mini" onclick="comingSoonAlert()">취소</button>
            </th:block>
            <th:block th:if="${h.status.name() == 'CANCELED'}">
              <button type="button" class="btn btn-grey btn-mini" onclick="comingSoonAlert()">재신청</button>
            </th:block>
          </div>
        </div>
      </div>

      <div class="bottom">
        <ul class="pagination">
          <li><a href="#">&lt;</a></li>
          <li class="active"><a href="#">1</a></li>
          <li><a href="#">&gt;</a></li>
        </ul>
      </div>
    </div>
  </div>

</div>
</body>
</html>
