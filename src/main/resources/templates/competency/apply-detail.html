<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">

  <div class="crumb">역량개발 <b>›</b> 프로그램 신청 <b>›</b> 신청 상세</div>
  <div class="page-title-row"><span class="page-title">프로그램 신청 상세</span></div>

  <div class="card-box">
    <!-- 상단 헤더 -->
    <div class="dp2-top">
      <div class="dp2-thumb" th:style="'background:' + ${program.gradientCss} + ';'" th:text="${program.icon}">🤖</div>
      <div class="dp2-head">
        <div class="dp2-status">
          <span class="dot"></span><span class="live">진행중</span>
          <span class="dday" th:text="${program.dday}">D-7</span>
          <span class="fav" onclick="this.textContent = this.textContent.includes('☆') ? '★ 관심프로그램' : '☆ 관심프로그램'">☆ 관심프로그램</span>
        </div>
        <div class="dp2-title" th:text="${program.title}">프로그램명</div>

        <!-- 다면적역량 · 운영부서 -->
        <div class="dp2-info"><div class="k">다면적 역량</div><div><span class="dp2-cred">🏅 <span th:text="${program.competencyArea}">창의</span> <span th:text="${program.competencyPoints}">7</span>점</span></div></div>
        <div class="dp2-info"><div class="k">운영부서</div><div th:text="${program.deptName} + ' · ' + ${program.deptContact}">운영부서 · 연락처</div></div>
      </div>
    </div>

    <!-- 신청 정보 -->
    <div class="sec-h"><span class="ic">🗒</span> 신청 정보</div>
    <div class="target-rows">
      <div class="target-row"><span class="tk">학교구분</span><span th:text="${program.targetSchoolLevel}">고등학교</span></div>
      <div class="target-row"><span class="tk">학년</span><span th:text="${program.targetGrade}">고1 ~ 고2</span></div>
    </div>

    <!-- 프로그램 정보 -->
    <div class="sec-h"><span class="ic">🗓</span> 프로그램 정보</div>
    <div class="prog-info-box">
      <div class="prog-info-top">
        <div class="left"><span class="pi-tag">신청가능</span><span class="pi-cha" th:text="${program.roundLabel}">1 / 2차수</span></div>
        <div class="right">신청 <b th:text="${program.appliedCount}">27</b> · 정원 <b th:text="${program.capacity}">20</b>
          <button type="button" class="btn btn-navy btn-mini" onclick="document.getElementById('applyReveal').classList.add('show'); document.getElementById('applyReveal').scrollIntoView({behavior:'smooth', block:'center'});">신청</button>
        </div>
      </div>
      <div class="prog-info-dates">
        <div><span class="k">📅 신청기간</span><span th:text="${program.applyPeriodFull}">기간</span></div>
        <div><span class="k">📅 교육기간</span><span th:text="${program.eduPeriodFull}">기간</span></div>
      </div>
    </div>

    <!-- 신청자 정보 (신청 클릭 시 노출) -->
    <div class="reveal-box" id="applyReveal">
      <div class="pt">신청자 정보</div>
      <div class="form-row"><div class="form-label">이름</div><div class="form-ctrl"><input type="text" class="mf-input ro" value="이하은" readonly style="width:120px;"> <span class="help">로그인 정보 자동</span></div></div>
      <div class="form-row"><div class="form-label">아이디</div><div class="form-ctrl"><input type="text" class="mf-input ro" value="haeun.lee02@sch.ac.kr" readonly style="width:200px;"></div></div>
      <div class="form-row"><div class="form-label">개인정보 동의<span class="req">*</span></div><div class="form-ctrl"><span class="check-item" onclick="toggleCheck(this.querySelector('.check-box')); document.getElementById('applySubmitBtn').disabled = !this.querySelector('.check-box').classList.contains('on');"><span class="check-box"></span>개인정보 수집·이용에 동의합니다.</span></div></div>
      <div class="form-row" style="justify-content:center;padding-top:8px;">
        <button type="button" class="btn btn-grey btn-mini" onclick="document.getElementById('applyReveal').classList.remove('show');">취소</button>
        <button type="button" id="applySubmitBtn" class="btn btn-navy btn-mini" disabled onclick="alert('신청이 완료되었습니다.'); location.href='/competency/history';">신청하기</button>
      </div>
    </div>

    <!-- 프로그램 상세내용 -->
    <div class="sec-h"><span class="ic">💡</span> 프로그램 상세내용</div>
    <div class="detail-content" th:utext="${program.description}">상세내용</div>
  </div>

</div>
</body>
</html>
